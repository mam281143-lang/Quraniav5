<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qurania — Apprends le Coran en t'amusant</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg:#0a0e17; --panel:#121a28; --panel-2:#1a2333; --border:#2a3548;
    --accent:#8b5cf6; --accent-light:#a78bfa; --accent-dark:#6d28d9;
    --gold:#fbbf24; --gold-light:#fcd34d; --teal:#14b8a6;
    --text:#e8eaf0; --text-dim:#8892a7;
    --success:#10b981; --success-light:#34d399; --error:#ef4444; --warn:#f59e0b;
    --shadow:rgba(0,0,0,0.5);
}
body.light {
    --bg:#f5f7fb; --panel:#ffffff; --panel-2:#f1f5f9; --border:#e2e8f0;
    --text:#0f172a; --text-dim:#64748b; --shadow:rgba(15,23,42,0.12);
    background: radial-gradient(ellipse at top, #eef2ff 0%, #f5f7fb 60%);
}
body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1a1f35 0%, #0a0e17 60%);
    color: var(--text); min-height: 100vh; padding-bottom: 3rem; line-height: 1.5;
    transition: background 0.3s, color 0.3s;
}
.container { max-width: 1150px; margin: 0 auto; padding: 1rem; }

.app-header { text-align: center; padding: 2rem 0 1rem; }
.app-header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: 0.03em;
    background: linear-gradient(135deg, var(--gold), var(--accent-light));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; }
.app-header p { color: var(--text-dim); font-size: 0.95rem; margin-top: 0.3rem; font-style: italic; }
.user-stats { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-top: 1rem; }
.stat-badge { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--text); }
.stat-badge strong { color: var(--gold); font-variant-numeric: tabular-nums; }

.nav-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center;
    margin: 1.5rem 0; }
.nav-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 0.55rem 0.85rem; border-radius: 10px; cursor: pointer; font-size: 0.76rem;
    transition: all 0.2s; font-weight: 500; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.nav-btn.active { background: var(--accent-dark); color: #fff; border-color: var(--accent); }

.view { display: none; animation: fadeIn 0.3s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.3rem; margin-bottom: 1rem; }
.card-title { font-size: 1.05rem; font-weight: 600; color: var(--accent-light);
    margin-bottom: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
.section-title { font-size: 1.4rem; font-weight: 700; color: var(--text);
    margin: 1.5rem 0 1rem; text-align: center; }
.section-subtitle { text-align: center; color: var(--text-dim); font-size: 0.9rem;
    margin-bottom: 1.5rem; }

.btn { background: var(--accent-dark); color: #fff; border: none; padding: 0.7rem 1.4rem;
    border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: all 0.2s; font-family: inherit; }
.btn:hover:not(:disabled) { background: var(--accent); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-gold { background: linear-gradient(135deg, var(--gold), #f59e0b); color: #0a0e17; }
.btn-gold:hover:not(:disabled) { background: linear-gradient(135deg, var(--gold-light), var(--gold)); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--panel-2); border-color: var(--accent); }
.btn-danger { background: var(--error); color: #fff; }
.btn-sm { padding: 0.45rem 0.85rem; font-size: 0.78rem; }
.btn-xs { padding: 0.28rem 0.6rem; font-size: 0.7rem; }

.progress-bar { background: rgba(0,0,0,0.3); border-radius: 8px; height: 10px; overflow: hidden;
    border: 1px solid var(--border); }
body.light .progress-bar { background: #e2e8f0; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold));
    transition: width 0.4s; border-radius: 8px; }
.progress-label { display: flex; justify-content: space-between; font-size: 0.75rem;
    color: var(--text-dim); margin-bottom: 0.3rem; }

.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem; margin-bottom: 1.5rem; }
.dash-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.1rem; text-align: center; transition: transform 0.2s; }
.dash-card:hover { transform: translateY(-2px); }
.dash-card .icon { font-size: 1.9rem; margin-bottom: 0.4rem; }
.dash-card .label { font-size: 0.72rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; }
.dash-card .value { font-size: 1.6rem; font-weight: 700; color: var(--gold);
    font-variant-numeric: tabular-nums; margin-top: 0.2rem; }
.dash-card .sub { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.3rem; }

.verse-day { background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(251,191,36,0.08));
    border: 1px solid var(--accent); border-radius: 14px; padding: 1.5rem; text-align: center;
    margin-bottom: 1rem; position: relative; overflow: hidden; }
.verse-day::before { content: "﷽"; position: absolute; top: -30px; right: -10px;
    font-family: 'Amiri', serif; font-size: 120px; color: rgba(251,191,36,0.06); pointer-events: none; }
.verse-day .ar { font-family: 'Amiri', serif; font-size: 1.8rem; color: var(--gold);
    direction: rtl; line-height: 1.8; margin-bottom: 0.8rem; }
.verse-day .tr { font-style: italic; color: var(--accent-light); font-size: 0.85rem; margin-bottom: 0.4rem; }
.verse-day .fr { color: var(--text); font-size: 0.92rem; }
.verse-day .ref { color: var(--text-dim); font-size: 0.75rem; margin-top: 0.6rem; }
.verse-day .label-day { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.1em; margin-bottom: 0.6rem; }

.goal-widget { background: linear-gradient(135deg, rgba(251,191,36,0.1), rgba(139,92,246,0.1));
    border: 1px solid var(--gold); border-radius: 14px; padding: 1.2rem; margin-bottom: 1rem; }
.goal-widget .g-label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase;
    letter-spacing: 0.08em; }
.goal-widget .g-value { font-size: 1.4rem; font-weight: 700; color: var(--gold); margin: 0.2rem 0; }

.hadith-card { background: linear-gradient(135deg, rgba(20,184,166,0.1), rgba(139,92,246,0.08));
    border: 1px solid var(--teal); border-radius: 14px; padding: 1.3rem; margin-bottom: 1rem; }
.hadith-card .h-ar { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--gold);
    direction: rtl; line-height: 1.8; margin-bottom: 0.7rem; }
.hadith-card .h-tr { font-style: italic; color: var(--accent-light); font-size: 0.82rem; margin-bottom: 0.4rem; }
.hadith-card .h-fr { color: var(--text); font-size: 0.9rem; }
.hadith-card .h-source { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.6rem; padding-top: 0.5rem;
    border-top: 1px solid var(--border); }

.alphabet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 0.6rem; }
.letter-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.8rem 0.4rem; text-align: center; cursor: pointer; transition: all 0.2s;
    position: relative; }
.letter-tile:hover { border-color: var(--accent); transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(139, 92, 246, 0.2); }
.letter-tile.learned { border-color: var(--success); background: rgba(16, 185, 129, 0.08); }
.letter-tile.learned::after { content: "✓"; position: absolute; top: 4px; right: 6px;
    color: var(--success); font-size: 0.8rem; font-weight: 700; }
.letter-tile .ar { font-family: 'Amiri', serif; font-size: 1.9rem;
    color: var(--gold); line-height: 1.2; }
.letter-tile .name { font-size: 0.68rem; color: var(--text-dim); margin-top: 0.25rem; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
    align-items: center; justify-content: center; padding: 1rem; z-index: 100;
    overflow-y: auto; backdrop-filter: blur(4px); }
.modal-overlay.visible { display: flex; }
.modal { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.5rem; max-width: 480px; width: 100%; text-align: center; animation: popIn 0.25s;
    margin: auto; max-height: 92vh; overflow-y: auto; }
@keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal .big-ar { font-family: 'Amiri', serif; font-size: 4.2rem; color: var(--gold);
    line-height: 1; margin-bottom: 0.3rem; }
.modal .modal-name { font-size: 1.25rem; font-weight: 700; color: var(--text); }
.modal .modal-sound { color: var(--text-dim); font-style: italic; margin: 0.3rem 0 0.6rem; font-size: 0.88rem; }
.modal .modal-example { background: var(--panel-2); border-radius: 10px; padding: 0.7rem;
    margin: 0.7rem 0; font-size: 0.85rem; }
.modal-actions { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap;
    margin-top: 0.8rem; }

.forms-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin: 0.6rem 0; }
.form-item { background: var(--panel-2); border-radius: 8px; padding: 0.5rem 0.2rem; }
.form-item .f-label { font-size: 0.58rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
.form-item .f-ar { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--gold); margin-top: 0.2rem; }

.trace-wrapper { position: relative; width: 220px; height: 220px; margin: 0.8rem auto 0.4rem;
    background: var(--panel-2); border-radius: 12px; border: 1px dashed var(--border); }
.trace-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-family: 'Amiri', serif; font-size: 160px; color: rgba(251,191,36,0.2); pointer-events: none;
    user-select: none; }
#traceCanvas { position: relative; cursor: crosshair; touch-action: none; border-radius: 12px; }

.vocab-controls { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem;
    flex-wrap: wrap; }
.flashcard { background: linear-gradient(135deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 1.5rem;
    text-align: center; min-height: 220px; display: flex; flex-direction: column;
    justify-content: center; cursor: pointer; transition: transform 0.2s; margin: 0 auto;
    max-width: 500px; user-select: none; }
.flashcard:hover { transform: translateY(-2px); }
.flashcard .ar-word { font-family: 'Amiri', serif; font-size: 3rem; color: var(--gold);
    line-height: 1.3; }
.flashcard .translit { font-style: italic; color: var(--text-dim); margin-top: 0.5rem;
    font-size: 1rem; }
.flashcard .translation { font-size: 1.4rem; color: var(--success-light); margin-top: 1rem;
    font-weight: 600; display: none; }
.flashcard.revealed .translation { display: block; animation: fadeIn 0.3s; }
.flashcard .hint { color: var(--text-dim); font-size: 0.8rem; margin-top: 1rem; }

.vocab-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 0.7rem; }
.vocab-item { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 0.7rem 0.9rem; display: flex; justify-content: space-between; align-items: center;
    gap: 0.5rem; }
.vocab-item .ar { font-family: 'Amiri', serif; font-size: 1.3rem; color: var(--gold); }
.vocab-item .fr { font-size: 0.85rem; color: var(--text); }
.vocab-item .pron { font-size: 0.68rem; color: var(--text-dim); font-style: italic; }
.vocab-item .srs-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
.vocab-item .srs-dot.due { background: var(--warn); }

.search-input { width: 100%; max-width: 400px; margin: 0 auto 1rem; display: block;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 0.65rem 1rem; border-radius: 10px; font-size: 0.88rem; font-family: inherit; }
.search-input:focus { outline: none; border-color: var(--accent); }

.surah-list { display: flex; flex-direction: column; gap: 0.8rem; }
.surah-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; }
.surah-card.favorite { border-color: var(--gold); }
.surah-header { padding: 1rem 1.2rem; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center; gap: 1rem; transition: background 0.2s; }
.surah-header:hover { background: var(--panel-2); }
.surah-header .surah-name { font-size: 1.02rem; font-weight: 600; color: var(--text); }
.surah-header .surah-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 0.2rem; }
.surah-header .surah-ar { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--gold); }
.surah-num-badge { display: inline-block; background: var(--accent-dark); color: #fff;
    font-size: 0.62rem; padding: 0.1rem 0.4rem; border-radius: 4px; margin-right: 0.4rem;
    vertical-align: middle; }
.surah-body { display: none; padding: 0 1.2rem 1.2rem; }
.surah-card.open .surah-body { display: block; animation: fadeIn 0.3s; }
.verse { padding: 0.8rem 0; border-top: 1px solid var(--border); }
.verse:first-child { border-top: none; }
.verse.playing { background: rgba(251,191,36,0.06); border-radius: 8px; padding: 0.8rem; margin: 0 -0.4rem; }
.verse-ar { font-family: 'Amiri', serif; font-size: 1.55rem; color: var(--gold);
    direction: rtl; text-align: right; line-height: 2; margin: 0.5rem 0;
    padding: 0.5rem 0.8rem; background: var(--panel-2); border-radius: 8px; }
.verse-tr { font-style: italic; color: var(--accent-light); font-size: 0.82rem; margin: 0.3rem 0; }
.verse-fr { color: var(--text); font-size: 0.88rem; }
.verse-actions { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.5rem; align-items: center; }
.audio-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--accent-light);
    padding: 0.28rem 0.65rem; border-radius: 6px; cursor: pointer; font-size: 0.72rem; }
.audio-btn:hover { border-color: var(--accent); color: var(--gold); }
.audio-btn.playing-now { background: rgba(251,191,36,0.2); border-color: var(--gold); color: var(--gold); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.6; } }
.fav-btn { background: transparent; border: none; color: var(--text-dim); font-size: 1.2rem;
    cursor: pointer; padding: 0.15rem 0.35rem; transition: all 0.2s; }
.fav-btn.active { color: var(--gold); }
.hifz-btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    padding: 0.28rem 0.65rem; border-radius: 6px; cursor: pointer; font-size: 0.72rem; }
.hifz-btn.memorized { background: rgba(16,185,129,0.15); border-color: var(--success); color: var(--success-light); }
.note-input { width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.82rem;
    font-family: inherit; margin-top: 0.5rem; resize: vertical; min-height: 50px; }

.play-surah-bar { background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(251,191,36,0.1));
    border: 1px solid var(--accent); border-radius: 10px; padding: 0.7rem 0.9rem;
    margin: 0.8rem 0; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.5rem; }
.play-surah-bar .psb-text { font-size: 0.82rem; color: var(--text); }
.play-surah-bar .psb-text strong { color: var(--gold); }

.exercise-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem; margin-top: 1rem; }
.exercise-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.2rem; text-align: center; cursor: pointer; transition: all 0.2s; }
.exercise-card:hover { border-color: var(--accent); transform: translateY(-3px); }
.exercise-card .ex-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.exercise-card .ex-title { font-weight: 600; color: var(--text); margin-bottom: 0.3rem; font-size: 0.92rem; }
.exercise-card .ex-desc { font-size: 0.75rem; color: var(--text-dim); }
.exercise-card.daily { border-color: var(--gold); background: linear-gradient(135deg, var(--panel), rgba(251,191,36,0.05)); }
.exercise-card.done { opacity: 0.6; }

.quiz-panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 1.5rem; max-width: 620px; margin: 1rem auto; }
.quiz-progress { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem; font-size: 0.82rem; color: var(--text-dim); }
.quiz-question { font-size: 1.15rem; text-align: center; margin: 1.3rem 0 1.6rem;
    line-height: 1.5; }
.quiz-question .big { font-family: 'Amiri', serif; font-size: 3.3rem; color: var(--gold);
    display: block; margin-bottom: 0.5rem; direction: rtl; }
.quiz-question .hint { color: var(--text-dim); font-size: 0.82rem; font-style: italic; }
.quiz-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 0.6rem; }
.quiz-option { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 0.9rem; border-radius: 10px; cursor: pointer; font-size: 0.92rem; text-align: center;
    transition: all 0.15s; font-family: inherit; }
.quiz-option:hover:not(:disabled) { border-color: var(--accent); background: rgba(139, 92, 246, 0.1); }
.quiz-option.correct { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success-light); }
.quiz-option.wrong { background: rgba(239, 68, 68, 0.15); border-color: var(--error); color: #fca5a5; }
.quiz-option:disabled { cursor: default; }
.quiz-feedback { text-align: center; margin-top: 1rem; font-weight: 600; min-height: 1.5rem; }
.quiz-feedback.ok { color: var(--success-light); }
.quiz-feedback.ko { color: #fca5a5; }

.result-panel { text-align: center; padding: 2rem 1rem; }
.result-panel .big-emoji { font-size: 3.5rem; margin-bottom: 0.8rem; }
.result-panel .result-title { font-size: 1.5rem; font-weight: 700; color: var(--gold);
    margin-bottom: 0.5rem; }
.result-panel .result-score { font-size: 1.05rem; color: var(--text); margin-bottom: 1.5rem; }

.badges-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 0.7rem; }
.badge-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.9rem 0.4rem; text-align: center; opacity: 0.4; transition: all 0.3s; }
.badge-item.earned { opacity: 1; border-color: var(--gold);
    box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); }
.badge-item .b-icon { font-size: 1.8rem; }
.badge-item .b-name { font-size: 0.66rem; color: var(--text); margin-top: 0.35rem;
    font-weight: 600; }
.badge-item .b-desc { font-size: 0.6rem; color: var(--text-dim); margin-top: 0.15rem; }

.duas-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
.dua-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 1.1rem; }
.dua-card .dua-ar { font-family: 'Amiri', serif; font-size: 1.5rem; color: var(--gold);
    direction: rtl; text-align: right; line-height: 1.9; margin-bottom: 0.6rem; }
.dua-card .dua-tr { font-style: italic; color: var(--accent-light); font-size: 0.82rem; margin-bottom: 0.3rem; }
.dua-card .dua-fr { color: var(--text); font-size: 0.88rem; margin-bottom: 0.5rem; }
.dua-card .dua-use { font-size: 0.72rem; color: var(--text-dim); padding-top: 0.5rem; border-top: 1px solid var(--border); }

.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.history-list { display: flex; flex-direction: column; gap: 0.5rem; }
.history-item { display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2); padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.82rem; }
.history-item .h-date { color: var(--text-dim); font-size: 0.72rem; }
.history-item .h-score { color: var(--gold); font-weight: 700; }

.bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 120px;
    padding: 0.5rem 0; border-bottom: 1px solid var(--border); margin-bottom: 0.5rem; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; height: 100%; justify-content: flex-end; }

.verse-order { display: flex; flex-direction: column; gap: 0.5rem; }

.audio-stop-btn { position: fixed; bottom: 80px; right: 20px; background: var(--error);

};
let state = loadState();
function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(defaultState));
        const s = JSON.parse(raw);
        return { ...defaultState, ...s,
            stats: { ...defaultState.stats, ...(s.stats || {}) },
            settings: { ...defaultState.settings, ...(s.settings || {}) },
            tasbih: { ...defaultState.tasbih, ...(s.tasbih || {}) },
            notes: s.notes || {}, vocabSRS: s.vocabSRS || {} };
    } catch (e) { return JSON.parse(JSON.stringify(defaultState)); }
}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function updateStreak() {
    const today = new Date().toDateString();
    if (state.lastVisit === today) return;
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if (state.lastVisit === yesterday) state.streak += 1;
    else state.streak = 1;
    state.lastVisit = today; saveState();
}
function resetDailyXPIfNeeded() {
    const today = new Date().toDateString();
    if (state.lastXPDate !== today) {
        state.todayXP = 0; state.lastXPDate = today; saveState();
    }
}

/* ============================================================
   NIVEAUX & XP
   ============================================================ */
function levelFromXP(xp) {
    if (xp < 100) return 1; if (xp < 300) return 2; if (xp < 600) return 3;
    if (xp < 1000) return 4; if (xp < 1500) return 5;
    return 6 + Math.floor((xp - 1500) / 500);
}
function xpForNextLevel(xp) {
    const l = levelFromXP(xp); const t = [0, 100, 300, 600, 1000, 1500];
    if (l <= 5) return t[l];
    return 1500 + (l - 5) * 500;
}
function xpForCurrentLevel(xp) {
    const l = levelFromXP(xp); const t = [0, 0, 100, 300, 600, 1000];
    if (l <= 5) return t[l];
    return 1500 + (l - 6) * 500;
}
function addXP(amount, reason) {
    resetDailyXPIfNeeded();
    state.xp += amount; state.todayXP += amount;
    const before = levelFromXP(state.xp - amount);
    const after = levelFromXP(state.xp);
    saveState(); updateHeader();
    showToast('+' + amount + ' XP' + (reason ? ' — ' + reason : ''));
    if (after > before) {
        setTimeout(function() { showToast('🎉 Niveau ' + after + ' !'); }, 1500);
        if (after >= 3) awardBadge('level-3');
        if (after >= 5) awardBadge('level-5');
    }
    if (state.todayXP >= state.dailyGoal) awardBadge('goal-reached');
}

let currentAudioPlayer = null;

function updateAudioStopButton() {
    const btn = document.getElementById('audio-stop-btn');
    if (!btn) return;
    if (currentAudioPlayer || playQueue.length > 0 || (window.speechSynthesis && window.speechSynthesis.speaking)) {
        btn.classList.add('visible');

        btn.classList.remove('visible');
    }
}
function stopAllAudio() {
    if (currentAudioPlayer) {
        try { currentAudioPlayer.pause(); } catch(e) {}
        currentAudioPlayer = null;
    }
    playQueue = []; playQueueIndex = 0; currentPlayingId = null;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    document.querySelectorAll('.playing').forEach(function(el) { el.classList.remove('playing'); });
    document.querySelectorAll('.playing-now').forEach(function(el) { el.classList.remove('playing-now'); });

}
function setPlayingIndicator(id) {
    document.querySelectorAll('.playing').forEach(function(el) { el.classList.remove('playing'); });

/* ---------------------------------------------------------
   playVerseRecitation — RÉCITATION D'UN VERSET
   ---------------------------------------------------------
   Paramètre preserveQueue :
   - false / undefined → lecture d'un verset isolé (réinitialise la file)
   - true              → la file est déjà construite (playSurah / playPositionRecitation),
                          on ne la vide PAS pour permettre l'enchaînement.
   --------------------------------------------------------- */
function playVerseRecitation(surahNumber, verseNumber, playId, preserveQueue) {
    if (currentPlayingId === playId && currentAudioPlayer && !currentAudioPlayer.paused) {
        stopAllAudio(); return;
    }
    if (currentAudioPlayer) { try { currentAudioPlayer.pause(); } catch(e) {} currentAudioPlayer = null; }
    if (!preserveQueue) { playQueue = []; playQueueIndex = 0; }

    const url = recitationUrl(surahNumber, verseNumber);
    currentAudioPlayer = new Audio(url);
    setPlayingIndicator(playId);
    updateAudioStopButton();

    currentAudioPlayer.onended = function() {
        if (playQueue.length > 0 && playQueueIndex < playQueue.length) {
            const next = playQueue[playQueueIndex];
            playQueueIndex++;
            // Appel enchaîné : on NE réinitialise PAS la file
            playVerseRecitation(next.surah, next.verse, next.id, true);
        } else {
            // Fin de la file : on nettoie tout
            setPlayingIndicator(null);
            currentAudioPlayer = null;
            playQueue = [];
            playQueueIndex = 0;
            updateAudioStopButton();
        }
    };
    currentAudioPlayer.onerror = function() {
        showToast('❌ Récitation indisponible — vérifiez la connexion');
        stopAllAudio();
    };
    currentAudioPlayer.play().catch(function(err) {
        showToast('❌ Impossible de lire la récitation');
        console.error(err);
        stopAllAudio();
    });

    if (!preserveQueue) {
        showToast('🎧 Récitation de Mishary Alafasy...');
        awardBadge('listener');
    }
}

/* playSurah — récitation complète d'une sourate */
function playSurah(surahNumber, nbVerses, surahId) {
    stopAllAudio();
    playQueue = [];
    for (let i = 1; i <= nbVerses; i++) {
        playQueue.push({ surah: surahNumber, verse: i, id: surahId + '_' + (i - 1) });
    }
    if (playQueue.length === 0) return;
    const first = playQueue[0];
    playQueueIndex = 1;
    // preserveQueue = true → la file construite ci-dessus est préservée
    playVerseRecitation(first.surah, first.verse, first.id, true);
    awardBadge('listener');
    showToast('🎧 Lecture complète de la sourate...');
}

function playAdhan() {
    stopAllAudio();

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
}
function escapeAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escapeHTML(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function highlight(text, query) {
    if (!query) return escapeHTML(text);
    const safe = escapeHTML(text);
    const re = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<span class="r-highlight">$1</span>');
}

/* ============================================================
   HORAIRES DE PRIÈRE
   ============================================================ */
function deg2rad(d) { return d * Math.PI / 180; }
function rad2deg(r) { return r * 180 / Math.PI; }
function calculatePrayerTimes(lat, lon, date) {
    const jd = date.getTime() / 86400000 + 2440587.5;
    const T = (jd - 2451545.0) / 36525;
    const L0 = (280.46646 + T * (36000.76983 + 0.0003032 * T)) % 360;
    const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
    const C = Math.sin(deg2rad(M)) * (1.914602 - T * (0.004817 + 0.000014 * T))
            + Math.sin(deg2rad(2*M)) * (0.019993 - 0.000101 * T)
            + Math.sin(deg2rad(3*M)) * 0.000289;
    const sunLon = L0 + C;
    const omega = 125.04 - 1934.136 * T;
    const lambda = sunLon - 0.00569 - 0.00478 * Math.sin(deg2rad(omega));
    const epsilon0 = 23 + (26 + ((21.448 - T * (46.815 + T * (0.00059 - T * 0.001813)))) / 60) / 60;
    const epsilon = epsilon0 + 0.00256 * Math.cos(deg2rad(omega));
    const decl = rad2deg(Math.asin(Math.sin(deg2rad(epsilon)) * Math.sin(deg2rad(lambda))));
    const y = Math.pow(Math.tan(deg2rad(epsilon / 2)), 2);
    const eqTime = 4 * rad2deg(
        y * Math.sin(2 * deg2rad(L0))
        - 2 * 0.016708634 * Math.sin(deg2rad(M))
        + 4 * 0.016708634 * y * Math.sin(deg2rad(M)) * Math.cos(2 * deg2rad(L0))
        - 0.5 * y * y * Math.sin(4 * deg2rad(L0))
        - 1.25 * 0.016708634 * 0.016708634 * Math.sin(2 * deg2rad(M))
    );
    const tzOffset = -date.getTimezoneOffset() / 60;
    const noonLocal = 720 - 4 * lon - eqTime + tzOffset * 60;
    function hourAngle(h) {
        const cosH = (Math.sin(deg2rad(h)) - Math.sin(deg2rad(lat)) * Math.sin(deg2rad(decl)))
                   / (Math.cos(deg2rad(lat)) * Math.cos(deg2rad(decl)));
        if (cosH > 1 || cosH < -1) return null;
        return rad2deg(Math.acos(cosH));
    }
    const sunriseHA = hourAngle(-0.833);
    const fajrHA = hourAngle(-18);
    const ishaHA = hourAngle(-17);
    const asrAlt = rad2deg(Math.atan(1 / (1 + Math.tan(deg2rad(Math.abs(lat - decl))))));
    const asrHA = hourAngle(asrAlt);
    function fmt(min) {
        if (min === null) return '—';
        let m = ((min % 1440) + 1440) % 1440;
        return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');
    }
    return {
        fajr: fajrHA === null ? null : fmt(noonLocal - 4 * fajrHA),
        sunrise: sunriseHA === null ? null : fmt(noonLocal - 4 * sunriseHA),
        dhuhr: fmt(noonLocal + 3),
        asr: asrHA === null ? null : fmt(noonLocal + 4 * asrHA + 3),
        maghrib: sunriseHA === null ? null : fmt(noonLocal + 4 * sunriseHA),
        isha: ishaHA === null ? null : fmt(noonLocal + 4 * ishaHA)
    };
}

let prayerData = null;

const PRAYERS_LIST = [
    { key: 'fajr', name: 'Fajr', icon: '🌅' },
    { key: 'sunrise', name: 'Lever', icon: '🌄' },
    { key: 'dhuhr', name: 'Dhuhr', icon: '☀️' },
    { key: 'asr', name: 'Asr', icon: '🌤️' },
    { key: 'maghrib', name: 'Maghrib', icon: '🌇' },
    { key: 'isha', name: 'Isha', icon: '🌙' }
];

function parseTimeToSec(s) {
    if (!s || s === '—') return null;
    const p = s.split(':');
    return parseInt(p[0], 10) * 3600 + parseInt(p[1], 10) * 60;
}

function getNextPrayerInfo() {
    if (!prayerData) return null;
    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    for (let i = 0; i < PRAYERS_LIST.length; i++) {
        const t = parseTimeToSec(prayerData.times[PRAYERS_LIST[i].key]);
        if (t !== null && t > currentSec) {
            return { prayer: PRAYERS_LIST[i], index: i, time: prayerData.times[PRAYERS_LIST[i].key], sec: t };
        }
    }
    return { prayer: PRAYERS_LIST[0], index: 0, time: prayerData.times.fajr, sec: parseTimeToSec(prayerData.times.fajr), tomorrow: true };
}

function setPrayerLocation(lat, lon, cityName) {
    const now = new Date();
    const times = calculatePrayerTimes(lat, lon, now);
    prayerData = { times: times, lat: lat, lon: lon, city: cityName, computedAt: now };
    state.settings.coords = { lat: lat, lon: lon };
    state.settings.city = cityName;
    saveState();
    awardBadge('prayer-setup');
    if (document.getElementById('view-practice').classList.contains('active')) {
        renderPrayerDisplay();
    }
    if (document.getElementById('view-home').classList.contains('active')) {

    }
}

}

function updatePrayerCountdown() {
    if (!prayerData) return;
    const cdEl = document.getElementById('prayer-cd-value');
    const heroNameEl = document.getElementById('prayer-hero-name');
    const heroTimeEl = document.getElementById('prayer-hero-time');
    const heroIconEl = document.getElementById('prayer-hero-icon');

    const now = new Date();
    if (!prayerData.computedAt || now.toDateString() !== prayerData.computedAt.toDateString()) {
        prayerData.times = calculatePrayerTimes(prayerData.lat, prayerData.lon, now);
        prayerData.computedAt = now;
    }

    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    const info = getNextPrayerInfo();
    if (!info) return;

    if (cdEl) {
        if (heroNameEl) heroNameEl.textContent = info.prayer.name;
        if (heroTimeEl) heroTimeEl.textContent = info.time || '—';
        if (heroIconEl) heroIconEl.textContent = info.prayer.icon;

        let diff;
        if (info.tomorrow) {
            diff = 86400 - currentSec + (info.sec || 0);
        } else {
            diff = Math.max(0, (info.sec || 0) - currentSec);
        }
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        cdEl.textContent = h + 'h ' + String(m).padStart(2, '0') + 'm ' + String(s).padStart(2, '0') + 's';
    }

    const homeCd = document.getElementById('home-prayer-cd');
    if (homeCd) {
        const homeName = document.getElementById('home-prayer-name');
        const homeTime = document.getElementById('home-prayer-time');
        const homeIcon = document.getElementById('home-prayer-icon');
        if (homeName) homeName.textContent = info.prayer.name;
        if (homeTime) homeTime.textContent = info.time || '—';
        if (homeIcon) homeIcon.textContent = info.prayer.icon;
        let diff;
        if (info.tomorrow) {
            diff = 86400 - currentSec + (info.sec || 0);
        } else {
            diff = Math.max(0, (info.sec || 0) - currentSec);
        }
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        homeCd.textContent = 'dans ' + h + 'h ' + String(m).padStart(2, '0') + 'm';
    }
}

function setupTracing() {
    const canvas = document.getElementById('traceCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 6;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    let drawing = false, lastX = 0, lastY = 0;
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    }
    canvas.addEventListener('pointerdown', function(e) {
        e.preventDefault(); drawing = true;
        const p = getPos(e); lastX = p.x; lastY = p.y;
        try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
    });
    canvas.addEventListener('pointermove', function(e) {
        if (!drawing) return; e.preventDefault();
        const p = getPos(e);
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
        lastX = p.x; lastY = p.y;
    });
    canvas.addEventListener('pointerup', function() { drawing = false; });
    canvas.addEventListener('pointercancel', function() { drawing = false; });
}
function clearTrace() {
    const canvas = document.getElementById('traceCanvas');
    if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}
function closeModal() { document.getElementById('modal').classList.remove('visible'); }

function countDueWords() {
    const now = Date.now();

function modeFlashcards() {
    const el = document.getElementById('vocab-content');

    const idx = vocabShuffled[vocabIndex];

    el.innerHTML = `

            <div class="ar-word">${v.ar}</div>
            <div class="translit">${v.tr}</div>

            <button class="btn btn-ghost btn-sm" onclick="nextVocab()">Suiv. →</button>
        </div>

            Carte ${vocabIndex + 1} / ${VOCAB.length} — ${state.learnedWords.length} appris

function nextVocab() { vocabIndex = (vocabIndex + 1) % VOCAB.length; modeFlashcards(); }
function prevVocab() { vocabIndex = (vocabIndex - 1 + VOCAB.length) % VOCAB.length; modeFlashcards(); }
function markWordLearned(idx) {
    if (state.learnedWords.indexOf(idx) === -1) {
        state.learnedWords.push(idx);
        state.vocabSRS[idx] = { level: 0, nextReview: Date.now() + 86400000 };
        saveState(); addXP(8, 'Mot appris'); checkBadges();
    } else showToast('Déjà appris ✓');
    nextVocab();
}

function filterVocabList() {
    const q = document.getElementById('vocab-search').value.toLowerCase().trim();
    document.querySelectorAll('#vocab-list .vocab-item').forEach(function(item) {
        item.style.display = (item.getAttribute('data-search') || '').indexOf(q) !== -1 ? '' : 'none';
    });
}
let reviewQueue = [], reviewIdx = 0;
function startReview() {
    const now = Date.now();
    reviewQueue = Object.keys(state.vocabSRS).filter(function(k) { return state.vocabSRS[k].nextReview <= now; }).map(function(k) { return parseInt(k, 10); });
    if (reviewQueue.length === 0) { showToast('✅ Aucun mot à réviser !'); return; }
    reviewQueue = shuffle(reviewQueue); reviewIdx = 0;
    renderReviewCard();
}
function renderReviewCard() {
    const el = document.getElementById('vocab-content');
    if (reviewIdx >= reviewQueue.length) {
        el.innerHTML = `<div class="quiz-panel result-panel"><div class="big-emoji">✅</div><div class="result-title">Révision terminée !</div><div class="result-score">${reviewQueue.length} mot(s) révisé(s)</div><button class="btn btn-gold" onclick="modeFlashcards()">Retour</button></div>`;
        return;
    }
    const idx = reviewQueue[reviewIdx];
    const v = VOCAB[idx];
    el.innerHTML = `
        <div style="text-align:center; color:var(--text-dim); font-size:0.82rem; margin-bottom:1rem;">Révision ${reviewIdx + 1} / ${reviewQueue.length}</div>
        <div class="flashcard" onclick="this.classList.toggle('revealed')">
            <div class="ar-word">${v.ar}</div><div class="translit">${v.tr}</div>
            <div class="translation">${v.fr}</div><div class="hint">👆 Clique pour révéler</div>
        </div>
        <div class="vocab-controls" style="margin-top:1.2rem;">
            <button class="btn btn-ghost btn-sm" onclick="answerReview(${idx}, false)">❌ À revoir</button>
            <button class="btn btn-gold btn-sm" onclick="answerReview(${idx}, true)">✅ Bien</button>
        </div>`;
}
function answerReview(idx, correct) {
    const s = state.vocabSRS[idx];
    if (!s) { reviewIdx++; renderReviewCard(); return; }
    if (correct) {
        s.level = Math.min(s.level + 1, 5);
        s.nextReview = Date.now() + [1,2,4,8,16,32][s.level] * 86400000;
        addXP(5, 'Révision réussie');
    } else {
        s.level = 0; s.nextReview = Date.now() + 86400000;
    }
    saveState(); reviewIdx++; renderReviewCard();
}

function toggleHifz(vid, surahId) {
    const i = state.hifzVerses.indexOf(vid);
    if (i === -1) { state.hifzVerses.push(vid); addXP(3, 'Verset mémorisé'); awardBadge('first-hifz'); }
    else state.hifzVerses.splice(i, 1);
    saveState(); renderSurahs();
    const card = document.getElementById('surah-' + surahId);
    if (card) card.classList.add('open');
}
function saveNote(vid, text) {
    if (text.trim()) { state.notes[vid] = text.trim(); if (Object.keys(state.notes).length === 1) awardBadge('note-taker'); }
    else delete state.notes[vid];
    saveState();
}
function markSurahStudied(id) {
    if (state.studiedSurahs.indexOf(id) === -1) {
        state.studiedSurahs.push(id); saveState();
        addXP(15, 'Sourate étudiée'); checkBadges();
        showToast('✓ Sourate étudiée'); renderSurahs();
        const card = document.getElementById('surah-' + id);
        if (card) card.classList.add('open');
    } else showToast('Déjà étudiée ✓');
}

function renderPrayerDisplay() {
    const el = document.getElementById('prayer-display');
    if (!el) return;

    if (!prayerData) {
        el.innerHTML = `
            <div class="prayer-empty">
                <div class="pe-icon">🕌</div>
                <div class="pe-text">Sélectionne ta ville ou autorise la géolocalisation pour voir les horaires de prière du jour.</div>
                <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                    <button class="btn btn-gold btn-sm" onclick="requestLocation()">📍 Ma position</button>
                    <button class="btn btn-ghost btn-sm" onclick="showCityPicker('empty')">🌍 Choisir une ville</button>
                </div>
                <div id="city-picker" class="hidden">
                    <div class="cities-grid">
                        ${CITIES.map(function(c) {
                            return '<button class="city-btn" onclick="pickCity(\'' + c.name + '\')">' + c.name + '</button>';
                        }).join('')}
                    </div>
                </div>
            </div>`;
        return;
    }

    const times = prayerData.times;
    const now = new Date();
    const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    let nextIdx = -1;
    for (let i = 0; i < PRAYERS_LIST.length; i++) {
        const t = parseTimeToSec(times[PRAYERS_LIST[i].key]);
        if (t !== null && t > currentSec) { nextIdx = i; break; }
    }
    if (nextIdx === -1) nextIdx = 0;
    const next = PRAYERS_LIST[nextIdx];

    el.innerHTML = `
        <div class="prayer-hero">
            <div class="prayer-hero-left">
                <div class="prayer-hero-icon" id="prayer-hero-icon">${next.icon}</div>
                <div class="prayer-hero-info">
                    <div class="prayer-hero-label">Prochaine prière</div>
                    <div class="prayer-hero-name" id="prayer-hero-name">${next.name}</div>
                    <div class="prayer-hero-time" id="prayer-hero-time">${times[next.key] || '—'}</div>
                </div>
            </div>
            <div class="prayer-hero-countdown">
                <div class="prayer-hero-cd-label">Dans</div>
                <div class="prayer-hero-cd-value" id="prayer-cd-value">—</div>
            </div>
        </div>

        <div class="prayer-timeline">
            ${PRAYERS_LIST.map(function(p, i) {
                const cls = i < nextIdx ? 'past' : (i === nextIdx ? 'next' : '');
                return '<div class="prayer-slot ' + cls + '">' +
                    '<div class="prayer-slot-icon">' + p.icon + '</div>' +
                    '<div class="prayer-slot-name">' + p.name + '</div>' +
                    '<div class="prayer-slot-time">' + (times[p.key] || '—') + '</div>' +
                '</div>';
            }).join('')}
        </div>

        <div class="prayer-footer">
            <div class="prayer-location">📍 ${prayerData.city} · ${prayerData.lat.toFixed(2)}° / ${prayerData.lon.toFixed(2)}°</div>
            <div style="display:flex; gap:0.4rem;">
                <button class="btn btn-ghost btn-xs" onclick="requestLocation()">📍 GPS</button>
                <button class="btn btn-ghost btn-xs" onclick="showCityPicker('footer')">🌍 Changer</button>
            </div>
        </div>
        <div id="city-picker-footer" class="hidden" style="margin-top:0.8rem;">
            <div class="cities-grid">
                ${CITIES.map(function(c) {
                    const active = c.name === prayerData.city ? ' active' : '';
                    return '<button class="city-btn' + active + '" onclick="pickCity(\'' + c.name + '\')">' + c.name + '</button>';
                }).join('')}
            </div>
        </div>`;

    updatePrayerCountdown();
}

function incrementTasbih() {
    const preset = TASBIH_PRESETS.find(function(p) { return p.id === state.tasbih.preset; });
    state.tasbih.count += 1;
    state.tasbih.totalCount += 1;
    if (state.tasbih.totalCount >= 33) awardBadge('tasbih-33');
    if (state.tasbih.totalCount >= 100) awardBadge('tasbih-100');
    if (state.tasbih.count === preset.target) {
        showToast('🎉 ' + preset.target + '× ' + preset.fr + ' terminé !');
        launchConfetti();
        addXP(5, 'Dhikr terminé');
    }
    if ('vibrate' in navigator) navigator.vibrate(15);
    saveState();
    renderTasbih();
}
function resetTasbih() { state.tasbih.count = 0; saveState(); renderTasbih(); }
function selectTasbihPreset(id) { state.tasbih.preset = id; state.tasbih.count = 0; saveState(); renderTasbih(); }

function renderSearch() {
    const el = document.getElementById('view-search');
    el.innerHTML = `
        <h2 class="section-title">🔍 Recherche globale</h2>
        <input class="search-input" type="text" id="global-search" placeholder="🔍 Rechercher..." oninput="performSearch()" autofocus>

            <p style="text-align:center; color:var(--text-dim); padding:2rem;">Tape pour rechercher...</p>
        </div>`;
}
function performSearch() {
    const q = document.getElementById('global-search').value.toLowerCase().trim();
    const results = document.getElementById('search-results');
    if (q.length < 2) { results.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:2rem;">Tape au moins 2 caractères...</p>'; return; }
    const found = [];
    LETTERS.forEach(function(l) {
        if (l.name.toLowerCase().includes(q) || l.ar.includes(q)) {
            found.push({ type: 'Lettre', title: l.name + ' (' + l.ar + ')', sub: l.sound, action: "switchView('alphabet')" });
        }
    });
    VOCAB.forEach(function(v) {
        if (v.ar.includes(q) || v.tr.toLowerCase().includes(q) || v.fr.toLowerCase().includes(q)) {
            found.push({ type: 'Vocab', title: v.ar + ' — ' + v.tr, sub: v.fr, action: "switchView('vocab')" });
        }
    });
    SURAHS.forEach(function(s) {
        if (s.name.toLowerCase().includes(q) || s.meaning.toLowerCase().includes(q)) {
            found.push({ type: 'Sourate', title: s.name, sub: s.meaning, action: "switchView('surahs')" });
        }
        s.verses.forEach(function(v, vi) {
            if (v.fr.toLowerCase().includes(q) || v.tr.toLowerCase().includes(q)) {
                found.push({ type: 'Verset', title: s.name + ' ' + (vi+1), sub: v.fr.slice(0, 100), action: "switchView('surahs')" });
            }
        });
    });
    DUAS.forEach(function(d) {
        if (d.fr.toLowerCase().includes(q) || d.tr.toLowerCase().includes(q)) {
            found.push({ type: 'Dua', title: d.tr, sub: d.fr, action: "switchView('duas')" });
        }
    });
    NAMES_OF_ALLAH.forEach(function(n) {
        if (n.tr.toLowerCase().includes(q) || n.fr.toLowerCase().includes(q)) {
            found.push({ type: 'Nom', title: n.ar + ' — ' + n.tr, sub: n.fr, action: "switchView('names')" });
        }
    });
    HADITHS.forEach(function(h) {
        if (h.fr.toLowerCase().includes(q) || h.tr.toLowerCase().includes(q)) {
            found.push({ type: 'Hadith', title: h.tr, sub: h.fr.slice(0, 100), action: "switchView('home')" });
        }
    });
    if (found.length === 0) { results.innerHTML = '<p style="text-align:center; color:var(--text-dim); padding:2rem;">Aucun résultat</p>'; return; }
    results.innerHTML = found.slice(0, 30).map(function(r) {
        return '<div class="search-result" onclick="' + r.action + '">' +
            '<div class="r-type">' + r.type + '</div>' +
            '<div class="r-title">' + highlight(r.title, q) + '</div>' +
            '<div class="r-sub">' + highlight(r.sub, q) + '</div>' +
        '</div>';
    }).join('');
}

function exportData() {

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (!imported || typeof imported !== 'object') throw new Error();
            state = { ...defaultState, ...imported,
                stats: { ...defaultState.stats, ...(imported.stats || {}) },
                settings: { ...defaultState.settings, ...(imported.settings || {}) },
                tasbih: { ...defaultState.tasbih, ...(imported.tasbih || {}) },
                notes: imported.notes || {}, vocabSRS: imported.vocabSRS || {} };
            prayerData = null;
            saveState(); applyTheme(); updateHeader(); renderSettings();
            showToast('✅ Restauré');
        } catch (err) { showToast('❌ Invalide'); }
    };
    reader.readAsText(file);
}

let currentQuiz = null;
function buildQuestions(type, n) {
    n = n || 10;
    const qs = [];
    const incL = (type === 'letters' || type === 'mix');
    const incV = (type === 'vocab' || type === 'mix');
    const incVers = (type === 'verses' || type === 'mix');
    const incN = (type === 'numbers' || type === 'mix');
    const incD = (type === 'duas' || type === 'mix');
    const incNm = (type === 'names' || type === 'mix');
    if (incL) {
        const count = type === 'mix' ? 3 : n;
        shuffle(LETTERS.map(function(_, i) { return i; })).slice(0, count).forEach(function(i) {
            const correct = LETTERS[i].name;
            const wrong = shuffle(LETTERS.filter(function(_, j) { return j !== i; }).map(function(l) { return l.name; })).slice(0, 3);
            qs.push({ kind: 'letter', question: LETTERS[i].ar, hint: "Quel est le nom ?", options: shuffle([correct].concat(wrong)), answer: correct });
        });
    }
    if (incV) {
        const count = type === 'mix' ? 3 : n;
        shuffle(VOCAB.map(function(_, i) { return i; })).slice(0, count).forEach(function(i) {
            const correct = VOCAB[i].fr;
            const wrong = shuffle(VOCAB.filter(function(_, j) { return j !== i; }).map(function(v) { return v.fr; })).slice(0, 3);
            qs.push({ kind: 'vocab', question: VOCAB[i].ar, hint: "Que signifie ?", options: shuffle([correct].concat(wrong)), answer: correct, translit: VOCAB[i].tr });
        });
    }
    if (incVers) {
        const count = type === 'mix' ? 2 : n;
        const allV = [];
        SURAHS.forEach(function(s) { s.verses.forEach(function(v, vi) { allV.push({ surah: s, verse: v, vi: vi }); }); });
        shuffle(allV).slice(0, count).forEach(function(item) {
            const words = item.verse.ar.split(/\s+/);
            if (words.length < 3) return;
            const hideIdx = Math.floor(Math.random() * words.length);
            const hidden = words[hideIdx];
            const display = words.slice(); display[hideIdx] = '____';
            const otherWords = allV.filter(function(v) { return v.verse.ar !== item.verse.ar; })
                .reduce(function(acc, v) { return acc.concat(v.verse.ar.split(/\s+/)); }, [])
                .filter(function(w) { return w !== hidden && w.length > 1; });
            const uniq = []; otherWords.forEach(function(w) { if (uniq.indexOf(w) === -1) uniq.push(w); });
            const wrong = shuffle(uniq).slice(0, 3);
            if (wrong.length < 3) return;
            qs.push({ kind: 'verse', question: display.join(' '), hint: item.surah.name + ', v.' + (item.vi+1), options: shuffle([hidden].concat(wrong)), answer: hidden });
        });
    }
    if (incN) {
        const count = type === 'mix' ? 2 : n;
        shuffle(NUMBERS.map(function(_, i) { return i; })).slice(0, count).forEach(function(i) {
            const correct = NUMBERS[i].fr;
            const wrong = shuffle(NUMBERS.filter(function(_, j) { return j !== i; }).map(function(x) { return x.fr; })).slice(0, 3);
            qs.push({ kind: 'number', question: NUMBERS[i].ar, hint: "Quel nombre ?", options: shuffle([correct].concat(wrong)), answer: correct });
        });
    }
    if (incD) {
        const count = type === 'mix' ? 2 : n;
        shuffle(DUAS.map(function(_, i) { return i; })).slice(0, count).forEach(function(i) {
            const correct = DUAS[i].fr;
            const wrong = shuffle(DUAS.filter(function(_, j) { return j !== i; }).map(function(d) { return d.fr; })).slice(0, 3);
            qs.push({ kind: 'dua', question: DUAS[i].ar, hint: "Quelle invocation ?", options: shuffle([correct].concat(wrong)), answer: correct, translit: DUAS[i].tr });
        });
    }
    if (incNm) {
        const count = type === 'mix' ? 2 : n;
        shuffle(NAMES_OF_ALLAH.map(function(_, i) { return i; })).slice(0, count).forEach(function(i) {
            const correct = NAMES_OF_ALLAH[i].fr;
            const wrong = shuffle(NAMES_OF_ALLAH.filter(function(_, j) { return j !== i; }).map(function(x) { return x.fr; })).slice(0, 3);
            qs.push({ kind: 'name', question: NAMES_OF_ALLAH[i].ar, hint: "Que signifie ?", options: shuffle([correct].concat(wrong)), answer: correct, translit: NAMES_OF_ALLAH[i].tr });
        });
    }
    return shuffle(qs).slice(0, n);
}
function startQuiz(type) {
    const questions = buildQuestions(type, 10);
    if (questions.length === 0) { showToast('Pas assez de contenu'); return; }
    currentQuiz = { type: type, questions: questions, index: 0, score: 0 };
    renderQuiz();
}
function startDailyChallenge() {
    if (state.lastDailyChallenge === todayKey()) { showToast('✅ Déjà terminé !'); return; }
    switchView('exercises');
    setTimeout(function() {
        currentQuiz = { type: 'daily', questions: buildQuestions('mix', 5), index: 0, score: 0, isDaily: true };
        renderQuiz();
    }, 200);
}
function renderQuiz() {
    const area = document.getElementById('quiz-area');
    if (!area || !currentQuiz) return;
    if (currentQuiz.index >= currentQuiz.questions.length) { renderQuizResult(); return; }
    const q = currentQuiz.questions[currentQuiz.index];
    const total = currentQuiz.questions.length;
    let qHTML = '';
    if (q.kind === 'verse') qHTML = '<div style="font-family:\'Amiri\',serif; font-size:1.6rem; color:var(--gold); direction:rtl; line-height:1.8;">' + q.question + '</div>';
    else {

    }
    area.innerHTML = `
        <div class="quiz-panel">
            <div class="quiz-progress">
                <span>${currentQuiz.isDaily ? '🌅 Défi — ' : ''}Question ${currentQuiz.index + 1} / ${total}</span>
                <span>Score : ${currentQuiz.score} ⭐</span>
            </div>
            <div class="progress-bar" style="margin-bottom:1rem;"><div class="progress-fill" style="width:${(currentQuiz.index / total) * 100}%"></div></div>
            <div class="quiz-question">${qHTML}<div class="hint" style="margin-top:0.8rem;">${q.hint || ''}</div></div>
            <div class="quiz-options" id="quiz-options">
                ${q.options.map(function(o) { return '<button class="quiz-option" data-answer="' + escapeAttr(o) + '">' + escapeHTML(o) + '</button>'; }).join('')}
            </div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
        </div>`;
    area.querySelectorAll('.quiz-option').forEach(function(btn) {
        btn.addEventListener('click', function() { answerQuiz(btn.getAttribute('data-answer'), btn); });
    });
}
function answerQuiz(choice, btn) {
    const q = currentQuiz.questions[currentQuiz.index];
    const options = document.querySelectorAll('.quiz-option');
    options.forEach(function(o) { o.disabled = true; });
    if (choice === q.answer) {
        btn.classList.add('correct');
        currentQuiz.score++;
        state.stats.correct++; saveState();
        addXP(10, 'Bonne réponse');
        document.getElementById('quiz-feedback').textContent = '✅ Bonne réponse !';
        document.getElementById('quiz-feedback').className = 'quiz-feedback ok';
    } else {
        btn.classList.add('wrong');
        state.stats.wrong++;
        options.forEach(function(o) { if (o.getAttribute('data-answer') === q.answer) o.classList.add('correct'); });
        saveState();
        document.getElementById('quiz-feedback').textContent = '❌ Réponse : ' + q.answer;
        document.getElementById('quiz-feedback').className = 'quiz-feedback ko';
    }
    updateHeader();
    setTimeout(function() { currentQuiz.index++; renderQuiz(); }, 1400);
}
function renderQuizResult() {
    const area = document.getElementById('quiz-area');
    const total = currentQuiz.questions.length;
    const score = currentQuiz.score;
    const pct = Math.round((score / total) * 100);
    if (!state.stats.history) state.stats.history = [];
    state.stats.history.push({ date: Date.now(), type: currentQuiz.isDaily ? 'daily' : currentQuiz.type, score: score, total: total });
    if (state.stats.history.length > 100) state.stats.history = state.stats.history.slice(-100);
    if (score === total) { awardBadge('perfect-quiz'); state.stats.perfectCount = (state.stats.perfectCount||0)+1; if (state.stats.perfectCount >= 3) awardBadge('perfect-3'); }
    awardBadge('first-quiz');
    if (currentQuiz.isDaily) { state.lastDailyChallenge = todayKey(); if (score >= 3) addXP(50, 'Défi réussi'); }
    saveState();
    let emoji = '😊', title = 'Pas mal !';
    if (pct === 100) { emoji = '🏆'; title = 'Parfait !'; }
    else if (pct >= 80) { emoji = '🎉'; title = 'Excellent !'; }
    else if (pct >= 60) { emoji = '👍'; title = 'Bien !'; }
    else if (pct >= 40) { emoji = '💪'; title = 'Continue'; }
    else { emoji = '📚'; title = 'À réviser'; }
    area.innerHTML = `
        <div class="quiz-panel result-panel">
            <div class="big-emoji">${emoji}</div>
            <div class="result-title">${title}</div>
            <div class="result-score">${score} / ${total} (${pct}%)</div>
            <div style="display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;">
                <button class="btn btn-gold" id="replay-btn">🔄 Rejouer</button>
                <button class="btn btn-ghost" onclick="switchView('exercises')">← Autres</button>
            </div>
        </div>`;
    document.getElementById('replay-btn').addEventListener('click', function() { startQuiz(currentQuiz.isDaily ? 'mix' : currentQuiz.type); });
    if (pct >= 80) launchConfetti();
}

        <div class="exercise-grid">
            <div class="exercise-card" onclick="startMemoryGame()"><div class="ex-icon">🧩</div><div class="ex-title">Memory Match</div><div class="ex-desc">Associe arabe ↔ français</div></div>
            <div class="exercise-card" onclick="startSpeedQuiz()"><div class="ex-icon">⚡</div><div class="ex-title">Quiz Chronométré</div><div class="ex-desc">60 secondes</div></div>
            <div class="exercise-card" onclick="startVerseOrder()"><div class="ex-icon">🔀</div><div class="ex-title">Ordre des versets</div><div class="ex-desc">Remets en ordre</div></div>
        </div>
        <div id="game-area" style="margin-top:1.5rem;"></div>`;
}
let memoryState = null;
function startMemoryGame() {
    const pairs = 8;
    const vocabPool = shuffle(VOCAB.map(function(_, i) { return i; })).slice(0, pairs);
    const cards = [];
    vocabPool.forEach(function(vocabIdx) {
        cards.push({ pairId: vocabIdx, content: VOCAB[vocabIdx].ar, type: 'ar', display: '<div class="m-ar">' + VOCAB[vocabIdx].ar + '</div>' });
        cards.push({ pairId: vocabIdx, content: VOCAB[vocabIdx].fr, type: 'fr', display: '<div class="m-fr">' + VOCAB[vocabIdx].fr + '</div>' });
    });
    memoryState = { cards: shuffle(cards), flipped: [], matched: 0, moves: 0, startTime: Date.now() };
    renderMemoryBoard();
}
function renderMemoryBoard() {
    const area = document.getElementById('game-area');
    const elapsed = Math.floor((Date.now() - memoryState.startTime) / 1000);
    area.innerHTML = `
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <span style="font-size:0.85rem; color:var(--text-dim);">Coups : <strong style="color:var(--gold);">${memoryState.moves}</strong></span>
                <span style="font-size:0.85rem; color:var(--text-dim);">Paires : <strong style="color:var(--gold);">${memoryState.matched}/${memoryState.cards.length/2}</strong></span>
                <span style="font-size:0.85rem; color:var(--text-dim);">⏱️ ${elapsed}s</span>
            </div>
            <div class="memory-board">
                ${memoryState.cards.map(function(c, i) {
                    const isFlipped = memoryState.flipped.indexOf(i) !== -1;
                    if (isFlipped || c.matched) {
                        return '<div class="memory-card ' + (c.matched ? 'matched' : 'flipped') + '" data-idx="' + i + '">' + c.display + '</div>';
                    }
                    return '<div class="memory-card" data-idx="' + i + '"><div class="m-back">❓</div></div>';
                }).join('')}
            </div>
            <div style="text-align:center; margin-top:0.8rem;">
                <button class="btn btn-ghost btn-sm" onclick="startMemoryGame()">🔄 Recommencer</button>
            </div>
        </div>`;
    area.querySelectorAll('.memory-card').forEach(function(el) {
        el.addEventListener('click', function() { handleMemoryClick(parseInt(el.getAttribute('data-idx'), 10)); });
    });
}
function handleMemoryClick(idx) {
    if (!memoryState || memoryState.flipped.indexOf(idx) !== -1 || memoryState.cards[idx].matched || memoryState.flipped.length >= 2) return;
    memoryState.flipped.push(idx);
    if (memoryState.flipped.length === 2) {
        memoryState.moves++;
        const a = memoryState.cards[memoryState.flipped[0]], b = memoryState.cards[memoryState.flipped[1]];
        if (a.pairId === b.pairId && a.type !== b.type) {
            a.matched = true; b.matched = true;
            memoryState.matched++;
            memoryState.flipped = [];
            renderMemoryBoard();
            if (memoryState.matched === memoryState.cards.length / 2) {
                const elapsed = Math.floor((Date.now() - memoryState.startTime) / 1000);
                addXP(30, 'Memory terminé'); awardBadge('memory-win'); launchConfetti();
                if (!state.stats.history) state.stats.history = [];
                state.stats.history.push({ date: Date.now(), type: 'memory', score: memoryState.matched, total: memoryState.matched });
                saveState();
                document.getElementById('game-area').innerHTML = `
                    <div class="quiz-panel result-panel">
                        <div class="big-emoji">🎉</div>
                        <div class="result-title">Bravo !</div>
                        <div class="result-score">${memoryState.moves} coups · ${elapsed}s</div>
                        <button class="btn btn-gold" onclick="startMemoryGame()">🔄 Rejouer</button>
                    </div>`;
                memoryState = null;
            }
        } else {
            renderMemoryBoard();
            setTimeout(function() { memoryState.flipped = []; renderMemoryBoard(); }, 900);
        }
    } else renderMemoryBoard();
}
let speedState = null;
function startSpeedQuiz() {
    speedState = { questions: buildQuestions('mix', 50), index: 0, score: 0, timeLeft: 60, timer: null };
    document.getElementById('game-area').innerHTML = '<div class="card"><p style="text-align:center; color:var(--text-dim);">Prépare-toi...</p></div>';
    setTimeout(function() {
        speedState.timer = setInterval(function() {
            speedState.timeLeft--; updateSpeedHeader();
            if (speedState.timeLeft <= 0) endSpeedQuiz();
        }, 1000);
        renderSpeedQuestion();
    }, 1000);
}
function updateSpeedHeader() {
    const t = document.getElementById('speed-timer');
    if (t) { t.textContent = '⏱️ ' + speedState.timeLeft + 's'; t.className = 'speed-timer' + (speedState.timeLeft <= 10 ? ' danger' : ''); }
    const s = document.getElementById('speed-score');
    if (s) s.textContent = '⭐ ' + speedState.score;
}
function renderSpeedQuestion() {
    if (!speedState || speedState.timeLeft <= 0 || speedState.index >= speedState.questions.length) {
        if (speedState) endSpeedQuiz(); return;
    }
    const q = speedState.questions[speedState.index];
    const area = document.getElementById('game-area');
    let qHTML = '';
    if (q.kind === 'verse') qHTML = '<div style="font-family:\'Amiri\',serif; font-size:1.4rem; color:var(--gold); direction:rtl;">' + q.question + '</div>';
    else qHTML = '<div class="big">' + q.question + '</div>';
    area.innerHTML = `
        <div class="quiz-panel">
            <div class="speed-header">
                <span id="speed-timer" class="speed-timer">⏱️ ${speedState.timeLeft}s</span>
                <span id="speed-score" style="font-weight:700; color:var(--gold);">⭐ ${speedState.score}</span>
            </div>
            <div class="quiz-question">${qHTML}<div class="hint" style="margin-top:0.5rem;">${q.hint || ''}</div></div>
            <div class="quiz-options">
                ${q.options.map(function(o) { return '<button class="quiz-option" data-answer="' + escapeAttr(o) + '">' + escapeHTML(o) + '</button>'; }).join('')}
            </div>
        </div>`;
    area.querySelectorAll('.quiz-option').forEach(function(btn) {
        btn.addEventListener('click', function() {
            const choice = btn.getAttribute('data-answer');
            if (choice === q.answer) { speedState.score++; state.stats.correct++; }
            else state.stats.wrong++;
            saveState(); speedState.index++;
            renderSpeedQuestion();
        });
    });
}
function endSpeedQuiz() {
    if (!speedState) return;
    clearInterval(speedState.timer);
    const score = speedState.score;
    addXP(score * 2, 'Quiz rapide');
    if (!state.stats.history) state.stats.history = [];
    state.stats.history.push({ date: Date.now(), type: 'speed', score: score, total: speedState.index });
    saveState(); awardBadge('speed-quiz');
    document.getElementById('game-area').innerHTML = `
        <div class="quiz-panel result-panel">
            <div class="big-emoji">⚡</div>
            <div class="result-title">Temps écoulé !</div>
            <div class="result-score">${score} bonnes réponses</div>
            <button class="btn btn-gold" onclick="startSpeedQuiz()">🔄 Rejouer</button>
        </div>`;
    speedState = null; updateHeader();
}
let verseOrderState = null;
function startVerseOrder() {
    const pool = SURAHS.filter(function(s) { return s.verses.length >= 3 && s.verses.length <= 7; });
    const surah = shuffle(pool)[0];
    if (!surah) { showToast('Pas de sourate assez courte'); return; }
    verseOrderState = { surah: surah, remaining: shuffle(surah.verses.map(function(_, i) { return i; })), placed: [], startTime: Date.now() };
    renderVerseOrder();
}
function renderVerseOrder() {
    const area = document.getElementById('game-area');
    const s = verseOrderState;
    area.innerHTML = `
        <div class="card">
            <div class="card-title">🔀 Remets les versets de ${s.surah.name} en ordre</div>
            <div style="margin-bottom:1rem;">
                <div class="progress-label"><span>Placés</span><span>${s.placed.length}/${s.surah.verses.length}</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${(s.placed.length/s.surah.verses.length)*100}%"></div></div>
            </div>
            <div class="verse-order">
                ${s.placed.map(function(idx) {
                    return '<div class="verse-order-item placed">✓ ' + escapeHTML(s.surah.verses[idx].ar.slice(0, 50)) + '...</div>';
                }).join('')}
                ${s.remaining.map(function(idx) {
                    return '<div class="verse-order-item" data-idx="' + idx + '">' + escapeHTML(s.surah.verses[idx].ar.slice(0, 50)) + '...</div>';
                }).join('')}
            </div>
            <div style="text-align:center; margin-top:0.8rem;">
                <button class="btn btn-ghost btn-sm" onclick="startVerseOrder()">🔄 Autre sourate</button>
            </div>
        </div>`;
    area.querySelectorAll('.verse-order-item[data-idx]').forEach(function(el) {
        el.addEventListener('click', function() {
            const idx = parseInt(el.getAttribute('data-idx'), 10);
            const nextExpected = s.placed.length;
            if (idx === nextExpected) {
                s.placed.push(idx);
                s.remaining = s.remaining.filter(function(x) { return x !== idx; });
                renderVerseOrder();
                if (s.placed.length === s.surah.verses.length) {
                    const elapsed = Math.floor((Date.now() - s.startTime) / 1000);
                    addXP(20, 'Sourate réordonnée'); launchConfetti();
                    document.getElementById('game-area').innerHTML = `
                        <div class="quiz-panel result-panel">
                            <div class="big-emoji">🎉</div>
                            <div class="result-title">Parfait !</div>
                            <div class="result-score">${s.surah.name} — ${elapsed}s</div>
                            <button class="btn btn-gold" onclick="startVerseOrder()">🔄 Rejouer</button>
                        </div>`;
                    verseOrderState = null;
                }
            } else showToast('❌ Pas le bon ordre');
        });
    });
}

/* ============================================================
   INIT
   ============================================================ */
(function init() {
    applyTheme();
    updateStreak();
    resetDailyXPIfNeeded();
    checkBadges();
    updateHeader();

    if (state.settings.coords && state.settings.coords.lat !== undefined) {
        const now = new Date();
        const times = calculatePrayerTimes(state.settings.coords.lat, state.settings.coords.lon, now);
        prayerData = {
            times: times,
            lat: state.settings.coords.lat,
            lon: state.settings.coords.lon,
            city: state.settings.city || 'Ma position',
            computedAt: now
        };
    }

    renderHome();
    initVoices();
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target.id === 'modal') closeModal();
    });
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
    });
    setInterval(function() {
        updateAudioStopButton();
        updatePrayerCountdown();
    }, 1000);
    saveState();
})();
</script>
